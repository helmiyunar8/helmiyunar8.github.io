<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TP3 - Bab 6 | Presentasi, Evaluasi, dan Refleksi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--gold:#b8860b;--light:#f4f4f4;--text:#333}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--light);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
body{overflow-x:hidden}
.sidebar{position:fixed;left:0;top:0;width:250px;height:100vh;background:#fff;border-right:1px solid #ddd;padding:22px 16px;overflow-y:auto;z-index:20}
.logo{text-align:center;margin-bottom:18px}
.logo img{max-width:120px;height:auto}
.sidebar h3{font-size:15px;margin:14px 8px;color:var(--gold)}
.sidebar a{display:block;text-decoration:none;color:#333;padding:9px 10px;border-radius:8px;margin:3px 0;font-size:14px}
.sidebar a:hover{background:#f3ead0;color:#8b6500}
.main{margin-left:250px;padding:24px 18px}
.viewer{max-width:1050px;margin:auto;background:#fff;border-radius:16px;border-top:5px solid var(--gold);padding:16px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 4px 14px}
.topbar h1{font-size:20px;margin:0;color:#5e4500}
.counter{font-size:13px;color:#666;white-space:nowrap}
.swipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;gap:14px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.page{flex:0 0 100%;scroll-snap-align:start;text-align:center}
.page img{display:block;width:100%;height:auto;max-height:calc(100vh - 110px);object-fit:contain;margin:auto;border-radius:10px;background:#fff}
.nav{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px 0 4px}
.nav button{border:0;background:var(--gold);color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.page-num{font-size:13px;color:#666;min-width:70px;text-align:center}
.hint{text-align:center;color:#777;font-size:13px;margin:5px 0 2px}
.menu-btn{display:none;position:fixed;top:12px;right:12px;z-index:30;border:0;background:var(--gold);color:#fff;border-radius:9px;padding:10px 12px;font-size:18px}
@media(max-width:800px){
.sidebar{display:none}.sidebar.open{display:block;width:260px;box-shadow:4px 0 15px rgba(0,0,0,.15)}
.main{margin-left:0;padding:62px 7px 12px}.menu-btn{display:block}
.viewer{padding:8px;border-radius:12px}.topbar{padding:2px 4px 8px}
.topbar h1{font-size:16px}.counter{font-size:12px}.swipe{gap:8px}
.page img{width:100%;max-height:none;border-radius:7px}
.hint{font-size:12px}
}
</style>
</head>
<body>

<button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')" aria-label="Buka menu">
<i class="fa-solid fa-bars"></i>
</button>

<aside class="sidebar">
  <div class="logo"><img src="../../asset/logo.png" alt="Logo SMKN 7 Luwu"></div>
  <h3><i class="fa-solid fa-graduation-cap"></i> Navigasi</h3>

  <a href="../index.html"><i class="fa-solid fa-book"></i> Materi</a>
  <a href="tp3.html"><i class="fa-solid fa-network-wired"></i> TP3</a>

  <a href="../../lkpd/index.html"><i class="fa-solid fa-file-lines"></i> LKPD</a>
  <a href="../../absen/index.html"><i class="fa-solid fa-user-check"></i> Absen</a>
  <a href="../../tryout-tkj-XII-2026/ranking_minggu2.html"><i class="fa-solid fa-ranking-star"></i> Ranking</a>
  <a href="../../cbt/index.html"><i class="fa-solid fa-laptop"></i> CBT Ujian</a>
  <a href="../../arsip.html"><i class="fa-solid fa-box-archive"></i> ARSIP</a>
</aside>

<main class="main">
<section class="viewer">
  <div class="topbar">
    <h1><i class="fa-solid fa-book-open"></i> BAB 6 — Presentasi, Evaluasi, dan Refleksi</h1>
    <div class="counter">3 halaman</div>
  </div>

  <div class="swipe" id="swipe" aria-label="Materi Bab 6">
    <div class="page"><img src="tp3-bab6-halaman-1.jpg" alt="Bab 6 halaman 1"></div>
    <div class="page"><img src="tp3-bab6-halaman-2.jpg" alt="Bab 6 halaman 2" loading="lazy"></div>
    <div class="page"><img src="tp3-bab6-halaman-3.jpg" alt="Bab 6 halaman 3" loading="lazy"></div>
  </div>

  <div class="nav">
    <button id="prev" onclick="go(-1)" disabled aria-label="Halaman sebelumnya"><i class="fa-solid fa-chevron-left"></i></button>
    <span class="page-num" id="pageNum">1 / 3</span>
    <button id="next" onclick="go(1)" aria-label="Halaman berikutnya"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
  <div class="hint">Geser ke kiri/kanan untuk berpindah halaman.</div>
</section>
</main>

<script>
const viewer=document.getElementById('swipe');
const pageNum=document.getElementById('pageNum');
const prev=document.getElementById('prev');
const next=document.getElementById('next');

function currentPage(){
  return Math.round(viewer.scrollLeft / viewer.clientWidth)+1;
}
function update(){
  const n=Math.max(1,Math.min(3,currentPage()));
  pageNum.textContent=n+' / 3';
  prev.disabled=n===1;
  next.disabled=n===3;
}
function go(dir){
  const n=Math.max(1,Math.min(3,currentPage()+dir));
  viewer.scrollTo({left:(n-1)*viewer.clientWidth,behavior:'smooth'});
}
viewer.addEventListener('scroll',()=>requestAnimationFrame(update));
window.addEventListener('resize',update);
</script>
</body>
</html>
